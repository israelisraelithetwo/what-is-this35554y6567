version: '3.8'

services:
  tts-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tts-web-app
    ports:
      - "5002:5002"
    volumes:
      # Mount static files for quick UI iteration
      - ./static:/app/static
      # Persist model cache
      - tts-models:/root/.local/share/tts
    environment:
      - PYTHONUNBUFFERED=1
      - COQUI_TOS_AGREED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  tts-models:
    driver: local
