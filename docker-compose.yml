version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: form-management-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: form_management
    networks:
      - form-management-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: form-management-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/form_management
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRE: 7d
      NODE_ENV: production
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - form-management-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: form-management-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - form-management-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  form-management-network:
    driver: bridge
